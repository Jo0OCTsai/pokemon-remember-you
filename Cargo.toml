[workspace]
resolver = "2"
members = ["crates/dex-core", "crates/dex-store", "crates/dex-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jo0OCTsai/pokemon-remember-you"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
dex-core = { path = "crates/dex-core", version = "0.1.0" }
dex-store = { path = "crates/dex-store", version = "0.1.0" }

[profile.release]
lto = "thin"
