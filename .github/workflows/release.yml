name: release

# tag 触发发布流：push v* tag → 三目标构建 release 二进制 → checksums.txt（FR-11.7）→ GitHub Release
# （notes 按 .github/release.yml 自动分类）。发布前流程：scripts/bump_version.py <version> 抬版本 →
# 提交 → git tag v<version> && git push origin v<version>。误发不回退 tag：发下一版修正。
on:
  push:
    tags: ['v*']

permissions:
  # 默认只读；仅 release job 提权写（建 Release / 传产物），缩小发布写权限面
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # ubuntu-22.04 的 glibc 较老，产物兼容性好（与 pokemon-choose-you 同取舍）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}
      - name: strip + 产物定名 dex-v<version>-<target>
        run: |
          strip "target/${{ matrix.target }}/release/dex"
          ver="${GITHUB_REF_NAME#v}"
          cp "target/${{ matrix.target }}/release/dex" "dex-v${ver}-${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dex-${{ matrix.target }}
          path: dex-v*-${{ matrix.target }}

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # checkout 供 skills/ 树入 checksums 口径（FR-11.7：二进制 + 内嵌技能物）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: checksums.txt（SHA-256）
        run: scripts/checksums.sh dist
      - name: GitHub Release（notes 自动分类 = .github/release.yml）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "dex ${GITHUB_REF_NAME}"
