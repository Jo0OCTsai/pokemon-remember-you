name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 机械质量门（fmt + clippy -D warnings + test）
        run: scripts/check.sh
      - name: JUnit 导出
        if: always()
        run: python3 scripts/junit_export.py
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: docs/reports/raw/junit-cli.xml

  # ===== 质量模块 job（声明单源 .devcontainer/stack.json quality_modules[]）=====

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 gitleaks v8.30.1（pinned）
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: 秘密扫描（全历史）
        run: gitleaks detect --source . --redact

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: rust 供应链门禁（漏洞 / license / bans / 来源）
        run: cargo deny --log-level error check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 覆盖率（lcov；status informational，趋势用）
        run: |
          mkdir -p coverage
          cargo llvm-cov --lcov --output-path coverage/lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: rust
          fail_ci_if_error: false

  # ===== 规范模块 job（声明单源 .devcontainer/stack.json conventions[]）=====

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 标题校验
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/commit-lint.sh "$TITLE"
      - name: 逐提交校验
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git rev-list "${BASE_SHA}..HEAD"); do
            bash .github/scripts/commit-lint.sh "$(git log -1 --format=%s "${sha}")"
          done
