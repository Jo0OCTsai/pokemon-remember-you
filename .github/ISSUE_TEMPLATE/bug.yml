name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 做了什么、预期什么、实际发生什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 载体（devcontainer/wsl/native/macos）+ 服务与栈（.devcontainer/stack.json services[]）+ 相关 commit
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
    validations:
      required: false
